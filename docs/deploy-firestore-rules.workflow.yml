# このファイルを .github/workflows/deploy-firestore-rules.yml へコピーすると
# main の firestore.rules 変更時に本番へ自動デプロイされます。
# （Bot の権限では workflows を直接 push できないため docs/ に同梱しています。
#   GitHub の Web UI から「Add file」で作成するのが簡単です。）
# 事前に GitHub Secrets へ FIREBASE_SERVICE_ACCOUNT を登録すること。
# 手順: docs/FIRESTORE_RULES_DEPLOY.md の 9.2 を参照。
name: Deploy Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'firebase.json'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secret is configured
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::GitHub Secret 'FIREBASE_SERVICE_ACCOUNT' が未設定です。docs/FIRESTORE_RULES_DEPLOY.md の 9.2に従って設定してください。"
            exit 1
          fi

      - name: Write service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"

      - name: Deploy firestore rules and indexes (mntb-listening only)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'mntb-listening' }}
        run: |
          if [ "$FIREBASE_PROJECT_ID" = "mntb-4ef06" ]; then
            echo "::error::統合版プロジェクト(mntb-4ef06)への誤デプロイを防止しました。リスニング専用プロジェクトを指定してください。"
            exit 1
          fi
          npx firebase-tools deploy --only firestore:rules,firestore:indexes --project "$FIREBASE_PROJECT_ID" --non-interactive --force

      - name: Cleanup key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
